<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giới Thiệu Bản Thân</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile-card {
            background-color: #ffffff;
            width: 350px;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .profile-card:hover {
            transform: translateY(-5px);
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #4a90e2;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            color: #2c3e50;
            font-size: 26px;
        }

        .role {
            color: #4a90e2;
            font-size: 16px;
            font-weight: 600;
            margin: 10px 0 20px;
        }

        .bio {
            color: #7f8c8d;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .contact-btn {
            display: inline-block;
            text-decoration: none;
            color: #fff;
            background-color: #4a90e2;
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .contact-btn:hover {
            background-color: #357abd;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <!-- Thay link ảnh dưới đây bằng link ảnh của bạn -->
        <img src="https://i.pravatar.cc/150?img=11" alt="Avatar" class="avatar">
        
        <h1>Nguyễn Văn A</h1>
        <div class="role">Frontend Developer</div>
        
        <p class="bio">
            Xin chào! Tôi là một người đam mê lập trình và sáng tạo thiết kế. 
            Tôi luôn thích học hỏi công nghệ mới và xây dựng những trải nghiệm web tuyệt vời.
        </p>
        
        <a href="mailto:emailcuaban@gmail.com" class="contact-btn">Liên hệ với tôi</a>
    </div>

</body>
</html>
